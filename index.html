<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ReserveFlow — a concept for Micah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #071422;
      --navy-2: #0e2240;
      --blue: #2f6bff;
      --ink: #122033;
      --muted: #5c6d84;
      --line: #e5edf6;
      --bg: #f5f7fb;
      --green: #0c7a56;
      --green-bg: #e7f6ef;
      --amber: #9a6408;
      --amber-bg: #fff4df;
      --red: #b43333;
      --red-bg: #fdecec;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--navy);
      color: #e7eef8;
      font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    button, input, select, textarea { font-family: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--blue); outline-offset: 2px;
    }
    header {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 22px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      border-top: 3px solid var(--blue);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 220px; }
    .mark {
      width: 36px; height: 36px; border-radius: 10px; background: var(--blue);
      display: grid; place-items: center; font-weight: 700; color: #fff;
    }
    .brand strong { display: block; font-size: 16px; letter-spacing: -.02em; }
    .brand em { display: block; font-style: normal; color: #9eb0c8; font-size: 12px; }
    .modes {
      display: flex; background: #10233c; padding: 4px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.08);
    }
    .modes button {
      border: 0; background: transparent; color: #c5d4e8; border-radius: 999px;
      padding: 8px 14px; font-weight: 600; font-size: 14px;
    }
    .modes button.on { background: var(--blue); color: #fff; }
    .pager { display: flex; align-items: center; gap: 8px; }
    .pager span { color: #9eb0c8; font-size: 13px; min-width: 64px; text-align: center; }
    .ghost, .next {
      border-radius: 999px; padding: 9px 14px; font-weight: 700; font-size: 14px; border: 0;
    }
    .ghost { background: transparent; color: #d5e2f4; box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); }
    .next { background: var(--blue); color: #fff; }
    .layout {
      height: calc(100% - 72px);
      display: grid;
      grid-template-columns: minmax(420px, 1fr) 400px;
      gap: 28px;
      align-items: center;
      max-width: 1220px;
      margin: 0 auto;
      padding: 18px 28px;
    }
    .layout.single { grid-template-columns: 1fr; justify-items: center; align-items: center; overflow: auto; }
    .device-col { display: flex; justify-content: center; min-width: 0; }
    .notes {
      background: #10233c;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      padding: 22px 22px 16px;
      max-height: calc(100vh - 110px);
      overflow: auto;
    }
    .eyebrow {
      margin: 0 0 6px; color: #8eb0ff; font-size: 12px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase;
    }
    .notes h2 { margin: 0 0 8px; font-size: 22px; letter-spacing: -.03em; }
    .purpose { margin: 0; color: #c9d7ea; font-size: 15px; line-height: 1.5; }
    .notes ul { margin: 12px 0 0; padding-left: 18px; color: #e4edf8; }
    .notes li { margin: 5px 0; }
    .covers { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
    .tag {
      font-size: 12px; font-weight: 600; color: #d7e4ff;
      background: rgba(47,107,255,.16); border-radius: 999px; padding: 5px 10px;
    }
    .phases {
      display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
      margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.08);
    }
    .phases h3 { margin: 0 0 6px; font-size: 13px; }
    .phases ul { margin: 0; padding-left: 16px; font-size: 12.5px; color: #c5d4e8; }
    .fine { margin: 12px 0 0; font-size: 12px; color: #93a6c0; line-height: 1.45; }
    .phone {
      width: 390px;
      height: min(800px, calc(100vh - 108px));
      background: #0c0e12;
      border-radius: 46px;
      padding: 10px 10px 16px;
      position: relative;
      box-shadow: 0 24px 60px rgba(0,0,0,.35);
      flex: none;
    }
    .island {
      position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
      width: 92px; height: 22px; background: #000; border-radius: 20px; z-index: 5;
    }
    .home-ind {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      width: 118px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.85);
    }
    .phone-screen {
      height: 100%; background: #fff; color: var(--ink); border-radius: 36px;
      overflow: hidden; display: flex; flex-direction: column; position: relative;
    }
    .status {
      flex: none; height: 46px; display: flex; align-items: flex-end; justify-content: space-between;
      padding: 0 22px 6px; font-size: 13px; font-weight: 700; background: #fff;
    }
    .status.light { background: var(--navy-2); color: #fff; }
    .status-icons { display: flex; gap: 5px; align-items: center; }
    .status svg { width: 16px; height: 16px; }
    .m-scroll { flex: 1; overflow: auto; background: #fff; }
    .m-scroll::-webkit-scrollbar { width: 0; }
    .dock {
      flex: none; padding: 10px 16px 14px; background: #fff; border-top: 1px solid var(--line);
    }
    .dock .check { margin: 0 0 8px; }
    .tabbar {
      flex: none; display: grid; grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--line); background: #fff; padding: 6px 4px 8px;
    }
    .tab {
      border: 0; background: transparent; display: flex; flex-direction: column;
      align-items: center; gap: 2px; color: #8b9bb0; font-size: 10px; font-weight: 600;
    }
    .tab svg { width: 22px; height: 22px; }
    .tab.on { color: var(--blue); }
    .home-hero { background: var(--navy-2); color: #fff; padding: 6px 18px 34px; border-radius: 0 0 28px 28px; }
    .hero-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .biz { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #9eb6d6; font-weight: 700; }
    .biz-sub { color: #d5e2f4; font-size: 13px; margin-top: 2px; }
    .hello { margin: 16px 0 0; color: #c5d4ea; font-size: 14px; }
    .hello-row { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
    .hello-row strong { font-size: 26px; letter-spacing: -.03em; }
    .avatar, .avatar-lg {
      border: 0; border-radius: 50%; background: #fff; color: var(--navy-2);
      display: grid; place-items: center; font-weight: 700;
    }
    .avatar { width: 38px; height: 38px; font-size: 13px; }
    .avatar-lg { width: 64px; height: 64px; font-size: 20px; background: #e8f0ff; color: var(--blue); margin: 8px auto; }
    .bell { position: relative; width: 36px; height: 36px; border: 0; background: transparent; color: #fff; display: grid; place-items: center; }
    .bell svg { width: 22px; height: 22px; }
    .badge {
      position: absolute; top: 0; right: 0; background: var(--blue); color: #fff;
      border: 2px solid var(--navy-2); font-size: 10px; min-width: 16px; height: 16px;
      border-radius: 99px; display: grid; place-items: center; font-weight: 700; padding: 0 3px;
    }
    .search, .cta-light, .btn, .btn-secondary, .qbtn, .slot, .svc, .chip, .row, .note, .nextcard {
      border: 0; text-align: left;
    }
    .search {
      width: 100%; margin-top: 16px; display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,.1); color: rgba(255,255,255,.82);
      border-radius: 12px; padding: 12px 14px; font-size: 14px; font-weight: 500;
    }
    .search svg { width: 18px; height: 18px; }
    .cta-light {
      margin-top: 12px; width: 100%; background: #fff; color: var(--navy-2);
      border-radius: 14px; min-height: 50px; font-weight: 700; font-size: 15px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .nextcard {
      display: block; margin: -22px 16px 0; background: #fff; border-radius: 18px;
      padding: 14px; box-shadow: 0 0 0 1px var(--line); color: var(--ink);
    }
    .kicker {
      font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
      color: var(--muted); font-weight: 700; margin: 0;
    }
    .nextcard h3 { margin: 4px 0; font-size: 16px; }
    .meta { color: var(--muted); font-size: 13px; }
    .rowline { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
    .pad { padding: 16px 16px 24px; }
    .qrow { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .qbtn {
      background: #fff; box-shadow: 0 0 0 1px var(--line); border-radius: 14px;
      padding: 12px 8px; text-align: center; font-size: 12px; font-weight: 700; color: var(--ink);
    }
    .section-label { padding: 18px 16px 8px; }
    .m-top {
      display: flex; align-items: center; gap: 8px; padding: 2px 8px 8px; min-height: 42px;
    }
    .m-top h1 { flex: 1; text-align: center; font-size: 16px; margin: 0; }
    .icon-btn {
      width: 36px; height: 36px; border: 0; background: transparent; border-radius: 12px;
      display: grid; place-items: center; color: var(--ink);
    }
    .icon-btn svg, .m-top svg { width: 20px; height: 20px; }
    .svc {
      width: 100%; background: #fff; box-shadow: 0 0 0 1px var(--line); border-radius: 16px;
      padding: 12px 14px; margin-bottom: 8px; color: var(--ink);
    }
    .svc.sel { box-shadow: 0 0 0 2px var(--blue); background: #f4f8ff; }
    .svc b, .who b { font-size: 14px; }
    .svc p { margin: 4px 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 14px; }
    .chip {
      border-radius: 999px; padding: 8px 12px; background: #fff; color: var(--ink);
      box-shadow: 0 0 0 1px var(--line); font-weight: 600; font-size: 13px;
    }
    .chip.sel { background: var(--navy-2); color: #fff; box-shadow: none; }
    .btn, .btn-secondary {
      width: 100%; min-height: 48px; border-radius: 14px; font-weight: 700; font-size: 15px;
      display: flex; align-items: center; justify-content: center; text-align: center;
    }
    .btn { background: var(--blue); color: #fff; }
    .btn-secondary { background: #fff; color: var(--ink); box-shadow: 0 0 0 1px #d5e0ec; }
    .btn-danger { background: #fff; color: var(--red); box-shadow: 0 0 0 1px #f0c9c9; }
    .stack { display: flex; flex-direction: column; gap: 8px; }
    .linkish {
      display: block; margin: 8px auto; border: 0; background: transparent;
      color: var(--blue); font-weight: 700; font-size: 14px; text-align: center;
    }
    .cal-head, .week-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .cal-head b, .week-head b { font-size: 15px; }
    .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .dow { text-align: center; font-size: 11px; color: #8b9bb0; font-weight: 700; padding: 4px 0; }
    .day {
      aspect-ratio: 1; border-radius: 12px; border: 0; background: transparent;
      font-weight: 600; color: var(--ink); position: relative; font-size: 13px;
    }
    .day.muted { color: #c5d0de; }
    .day.sel { background: var(--blue); color: #fff; }
    .day.today:not(.sel) { box-shadow: inset 0 0 0 1.5px var(--blue); }
    .day .mark {
      width: 4px; height: 4px; border-radius: 50%; background: var(--blue);
      position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
    }
    .day.sel .mark { background: #fff; }
    .day.full .mark { background: #b7c3d4; }
    .legend-row { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin: 8px 0 12px; }
    .legend-row i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
    .d-open { background: var(--blue); }
    .d-booked { background: var(--navy-2); }
    .d-block { background: #c5d0de; }
    .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .slot {
      border-radius: 14px; padding: 10px; background: #fff; color: var(--ink);
      box-shadow: 0 0 0 1px #e1eaf3;
    }
    .slot b { display: block; font-size: 14px; }
    .slot em { display: block; font-style: normal; font-size: 12px; color: var(--muted); margin-top: 2px; }
    .slot.sel { background: var(--blue); color: #fff; box-shadow: none; }
    .slot.sel em { color: rgba(255,255,255,.85); }
    .slot:disabled { background: #f4f7fb; color: #8b9bb0; }
    .banner {
      background: #f4f8ff; color: #23406e; border-radius: 12px; padding: 10px 12px;
      font-size: 13px; margin-bottom: 10px;
    }
    .summary {
      box-shadow: 0 0 0 1px var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px;
    }
    .summary h3 { margin: 0 0 4px; font-size: 16px; }
    .check {
      display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: #24364c; margin: 8px 0 12px;
    }
    .check input { margin-top: 2px; accent-color: var(--blue); }
    .field, textarea, select.field, .admin-search, .mini-form input, .mini-form select {
      width: 100%; border: 1px solid #dbe5f0; background: #fff; border-radius: 12px;
      padding: 12px; font-size: 14px; outline: none; color: var(--ink);
    }
    textarea { min-height: 56px; resize: vertical; }
    .field:focus, textarea:focus, select:focus, .admin-search:focus, .mini-form input:focus { border-color: var(--blue); }
    .label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin: 10px 0 6px; }
    .pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
    .pill-confirmed { background: var(--green-bg); color: var(--green); }
    .pill-pending { background: var(--amber-bg); color: var(--amber); }
    .pill-cancelled { background: var(--red-bg); color: var(--red); }
    .pill-completed { background: #eef2f6; color: var(--muted); }
    .seg { display: flex; background: #f4f7fb; border-radius: 12px; padding: 3px; margin-bottom: 8px; }
    .seg button { flex: 1; border: 0; background: transparent; border-radius: 10px; padding: 8px; font-weight: 700; font-size: 13px; color: var(--muted); }
    .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
    .book {
      width: 100%; background: #fff; box-shadow: 0 0 0 1px var(--line); border-radius: 16px;
      padding: 12px 14px; margin-bottom: 8px; color: var(--ink); text-align: left;
    }
    .book h3 { margin: 0 0 2px; font-size: 15px; }
    .ok {
      width: 64px; height: 64px; border-radius: 50%; background: var(--green-bg); color: var(--green);
      display: grid; place-items: center; margin: 28px auto 12px;
    }
    .ok.pending { background: var(--amber-bg); color: var(--amber); }
    .ok svg { width: 32px; height: 32px; }
    .center { text-align: center; padding: 0 20px; }
    .center h2 { margin: 0; font-size: 22px; letter-spacing: -.03em; }
    .refbox {
      margin: 16px auto; width: fit-content; min-width: 190px; border: 1px dashed #c5d4e6;
      border-radius: 14px; padding: 10px 16px; text-align: center;
    }
    .refbox b { display: block; font-size: 20px; letter-spacing: .04em; }
    .refbox span { color: var(--muted); font-size: 12px; }
    .note { display: flex; gap: 10px; width: 100%; padding: 12px 0; border-top: 1px solid #eef2f6; background: #fff; color: var(--ink); }
    .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: transparent; flex: none; }
    .note.unread .dot { background: var(--blue); }
    .note b { display: block; font-size: 14px; }
    .row {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0; border-top: 1px solid #eef2f6; background: #fff; color: var(--ink);
    }
    .row small, .sub { display: block; color: var(--muted); font-size: 12px; font-weight: 500; }
    .row svg { width: 18px; height: 18px; color: #8b9bb0; }
    .switch {
      width: 42px; height: 26px; border-radius: 99px; background: #d5deea; border: 0; position: relative; flex: none;
    }
    .switch i {
      position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
      background: #fff; transition: left .15s ease;
    }
    .switch.on { background: var(--blue); }
    .switch.on i { left: 19px; }
    .pref { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid #eef2f6; }
    .sheet-bg {
      position: absolute; inset: 0; background: rgba(10,18,32,.45);
      display: flex; align-items: flex-end; z-index: 6;
    }
    .sheet { background: #fff; width: 100%; border-radius: 20px 20px 36px 36px; padding: 18px 18px 28px; color: var(--ink); }
    .sheet h3 { margin: 0 0 6px; }
    .addon {
      box-shadow: 0 0 0 1px var(--line); border-radius: 16px; padding: 12px; margin-bottom: 8px;
    }
    .addon p { margin: 4px 0 8px; color: var(--muted); font-size: 13px; }
    .laptop {
      width: min(860px, calc(100vw - 480px));
      height: min(760px, calc(100vh - 108px));
      background: #fff; color: var(--ink); border-radius: 16px; overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,.35); display: flex; flex-direction: column;
      position: relative;
    }
    .laptop .sheet-bg { align-items: center; justify-content: center; padding: 24px; }
    .laptop .sheet { border-radius: 16px; width: min(420px, 100%); }
    .chrome {
      height: 40px; background: #f4f7fb; display: flex; align-items: center; gap: 10px;
      padding: 0 14px; color: var(--muted); font-size: 12px; font-weight: 600;
      border-bottom: 1px solid var(--line); flex: none;
    }
    .dots { display: flex; gap: 6px; }
    .dots i { width: 8px; height: 8px; border-radius: 50%; background: #d3dde8; display: block; }
    .admin { display: flex; min-height: 0; flex: 1; }
    .aside-nav { width: 188px; background: var(--navy-2); color: #fff; padding: 16px 10px; flex: none; }
    .alogo { padding: 4px 10px 16px; }
    .alogo b { display: block; font-size: 16px; }
    .alogo span { color: #9eb0c8; font-size: 12px; }
    .navbtn {
      width: 100%; display: flex; align-items: center; gap: 8px; color: #d5e2f4;
      border: 0; background: transparent; border-radius: 10px; padding: 10px;
      font-weight: 600; font-size: 14px; text-align: left;
    }
    .navbtn svg { width: 18px; height: 18px; }
    .navbtn.on { background: var(--blue); color: #fff; }
    .amain { flex: 1; overflow: auto; background: var(--bg); padding: 16px; }
    .amain h2 { margin: 0; font-size: 20px; letter-spacing: -.03em; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
    .stat { background: #fff; border-radius: 14px; padding: 12px; box-shadow: 0 0 0 1px var(--line); }
    .stat b { display: block; font-size: 22px; letter-spacing: -.03em; }
    .stat span { color: var(--muted); font-size: 12px; }
    .bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: #e8eef5; margin-top: 12px; }
    .bar .occ { background: var(--navy-2); }
    .bar .op { background: var(--blue); }
    .bar .bl { background: #c5d0de; }
    .bar-legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 6px; }
    .split { display: grid; grid-template-columns: 1.15fr .85fr; gap: 10px; margin-top: 12px; }
    .panel { background: #fff; box-shadow: 0 0 0 1px var(--line); border-radius: 16px; padding: 14px; }
    .panel h3 { margin: 0 0 10px; font-size: 14px; }
    .tl-row, .pay-row, .act-row, .set-row {
      display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid #eef2f6;
    }
    .tl-time { width: 72px; flex: none; font-size: 12px; font-weight: 700; color: var(--muted); padding-top: 2px; }
    .tl-card { flex: 1; }
    .mini { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .mini .btn, .mini .btn-secondary, .mini .ghost {
      width: auto; min-height: 32px; padding: 6px 10px; font-size: 12px; border-radius: 9px;
    }
    .mini .ghost { color: var(--ink); box-shadow: inset 0 0 0 1px #d5e0ec; }
    .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .wday {
      background: #fff; border-radius: 12px; min-height: 220px; padding: 8px;
      box-shadow: 0 0 0 1px var(--line); text-align: left; color: var(--ink); border: 0;
    }
    .wday.off { background: #eef2f6; color: var(--muted); }
    .wday header, .wday .wd { font-size: 11px; font-weight: 700; color: var(--muted); }

    function timeSlots(date) {
      const dow = parseISO(date).getDay();

    function statusBar(light) {
      return `<div class="status ${light ? "light" : ""}"><span>8:41</span><span class="status-icons">${icon("signal")}${icon("wifi")}${icon("battery")}</span></div>`;
    }
    function tabbar() {
      const items = [["home", "Home", "home"], ["bookings", "Bookings", "list"], ["calendar", "Calendar", "calendar"], ["profile", "Profile", "user"]];
      return `<nav class="tabbar">${items.map(([id, label, ic]) => `<button type="button" class="tab ${state.screen === id ? "on" : ""}" data-act="screen" data-arg="${id}">${icon(ic)}<span>${label}</span></button>`).join("")}</nav>`;
    }
    function topbar(title, back) {
      return `<div class="m-top">${back ? `<button type="button" class="icon-btn" data-act="screen" data-arg="${back}" aria-label="Back">${icon("back")}</button>` : `<span class="icon-btn"></span>`}<h1>${esc(title)}</h1><span class="icon-btn"></span></div>`;
    }
    function calendarHtml(y, m, selected, mode) {
      const min = mode === "customer" ? 9 : 10;
      const prevOk = !(y === 2026 && m <= min);
      const nextOk = !(y === 2026 && m >= 12);
      const cells = monthCells(y, m);
      const days = cells.map(iso => {
        if (!iso) return `<span></span>`;
        const tone = dayTone(iso);
        const mine = state.bookings.some(b => b.owner === "alex" && b.date === iso && b.status !== "cancelled");
        const past = iso < TODAY;
        const disabled = mode === "availability" && past;
        const cls = ["day", past && mode === "availability" ? "muted" : "", iso === selected ? "sel" : "", iso === TODAY ? "today" : "", tone === "full" ? "full" : ""].filter(Boolean).join(" ");
        const dot = tone === "open" || tone === "full" || mine ? `<i class="mark"></i>` : "";
        return `<button type="button" class="${cls}" ${disabled ? "disabled" : ""} data-act="date" data-arg="${iso}">${Number(iso.slice(-2))}${dot}</button>`;
      }).join("");
      const dows = ["M", "T", "W", "T", "F", "S", "S"].map(d => `<span class="dow">${d}</span>`).join("");
      return `<div class="cal-head"><button type="button" class="icon-btn" data-act="month" data-arg="-1" ${prevOk ? "" : "disabled"} aria-label="Previous month">${icon("back")}</button><b>${esc(monthTitle(y, m))}</b><button type="button" class="icon-btn" data-act="month" data-arg="1" ${nextOk ? "" : "disabled"} aria-label="Next month">${icon("chev")}</button></div><div class="cal">${dows}${days}</div>`;
    }

    function viewHome() {

        : `<div class="nextcard"><div class="kicker">Next reservation</div><h3>Nothing coming up</h3><button type="button" class="linkish" data-act="screen" data-arg="services">Book a reservation</button></div>`;
      return `<div class="home-hero"><div class="hero-top"><div><div class="biz">Northline</div><div class="biz-sub">Reservations</div></div><button type="button" class="bell" data-act="screen" data-arg="notifications" aria-label="Notifications">${icon("bell")}${badge}</button></div><div class="hello">Good morning</div><div class="hello-row"><strong>${esc(firstName())}</strong><button type="button" class="avatar" data-act="screen" data-arg="profile" aria-label="Profile">${esc(initials(state.profile.name))}</button></div><button type="button" class="search" data-act="screen" data-arg="services">${icon("search")} Search services</button><button type="button" class="cta-light" data-act="screen" data-arg="services">Book a reservation</button></div>${card}<div class="section-label kicker">Shortcuts</div><div class="pad" style="padding-top:0"><div class="qrow"><button type="button" class="qbtn" data-act="screen" data-arg="services">Services</button><button type="button" class="qbtn" data-act="screen" data-arg="availability">Open times</button><button type="button" class="qbtn" data-act="screen" data-arg="help">Help</button></div></div>`;
    }
    function viewServices() {
      const q = state.serviceQuery.trim().toLowerCase();
      const list = SERVICES.filter(s => !q || (s.name + s.desc).toLowerCase().includes(q));
      const cards = list.length ? list.map(s => `<button type="button" class="svc ${state.draft.serviceId === s.id ? "sel" : ""}" data-act="service" data-arg="${s.id}"><b>${esc(s.name)}</b><p>${esc(s.desc)}</p><span class="meta">${esc(s.duration)} · ${esc(s.priceLabel)}${state.approval[s.id] ? " · Confirmed by the business" : ""}</span></button>`).join("") : `<p class="meta">No services match that search.</p>`;
      return `${topbar("Services", "home")}<div class="pad"><input class="field" data-field="serviceQuery" data-live="1" placeholder="Search services" value="${esc(state.serviceQuery)}" aria-label="Search services" /><div class="label">How to meet</div><div class="chips"><button type="button" class="chip ${state.draft.meet === "video" ? "sel" : ""}" data-act="meet" data-arg="video">Video call</button><button type="button" class="chip ${state.draft.meet === "office" ? "sel" : ""}" data-act="meet" data-arg="office">In person</button></div><div class="label">Advisor</div><div class="chips"><button type="button" class="chip ${state.draft.advisor === "first" ? "sel" : ""}" data-act="advisor" data-arg="first">First available</button><button type="button" class="chip ${state.draft.advisor === "assigned" ? "sel" : ""}" data-act="advisor" data-arg="assigned">Assigned advisor</button></div>${cards}</div>`;
    }
    function viewAvailability() {
      const svc = state.draft.serviceId ? serviceById(state.draft.serviceId) : null;
      const slots = timeSlots(state.draft.date);
      const moving = state.draft.rescheduleId ? bookingById(state.draft.rescheduleId) : null;
      const banner = moving ? `<div class="banner">Moving ${esc(moving.ref)} to a new time.</div>` : (svc ? `<div class="banner">${esc(svc.name)} · ${esc(svc.duration)} · ${esc(svc.priceLabel)}</div>` : `<div class="banner">Pick a time, then choose a service.</div>`);
      let body;
      if (!slots.length) body = `<p class="meta">Sunday is closed. Choose another date.</p>`;
      else if (slots.every(s => !customerCanTake(s))) body = `<div class="slots">${slotButtons(slots)}</div><p class="meta" style="margin-top:10px">This day is fully booked. Choose another date.</p>`;
      else body = `<div class="slots">${slotButtons(slots)}</div>`;
      return `${topbar("Availability", moving ? "detail" : "services")}<div class="pad">${banner}${calendarHtml(state.monthA.y, state.monthA.m, state.draft.date, "availability")}<div class="legend-row"><span><i class="d-open"></i>Open</span><span><i class="d-booked"></i>Booked</span><span><i class="d-block"></i>Unavailable</span></div><p class="meta" style="margin-top:0">Central Time · Mon–Fri 9–5, Sat 9–12</p>${body}</div>`;
    }
    function slotButtons(slots) {
      return slots.map(s => {
        const mine = alexHolds(s);
        const selectable = customerCanTake(s);
        const label = mine && s.status === "open" ? "Your booking" : s.label;
        const cls = state.draft.time === s.t && selectable ? "slot sel" : "slot";
        return `<button type="button" class="${cls}" data-act="time" data-arg="${s.t}" ${selectable ? "" : "disabled"}><b>${esc(prettyTime(s.t))}</b><em>${esc(label)}</em></button>`;
      }).join("");
    }
    function viewConfirm() {
      const svc = serviceById(state.draft.serviceId);
      const moving = !!state.draft.rescheduleId;
      const soon = hoursUntil(state.draft.date, state.draft.time) < state.rules.cancelHours;
      const pay = svc.price > 0 && !moving ? `<div class="label">Payment</div><div class="chips"><button type="button" class="chip ${state.draft.payNow ? "sel" : ""}" data-act="pay" data-arg="now">Pay now · ${esc(svc.priceLabel)}</button><button type="button" class="chip ${!state.draft.payNow ? "sel" : ""}" data-act="pay" data-arg="later">Reserve now, pay later</button></div>` : (svc.price === 0 ? `<p class="meta">No payment is due for this complimentary reservation.</p>` : "");
      const approval = state.approval[svc.id] && !moving ? `<p class="meta">Northline confirms this request before it is final.</p>` : "";
      const late = soon ? `<p class="meta">This time is inside the ${state.rules.cancelHours}-hour window, so a late change rule can apply.</p>` : "";
      return `${topbar(moving ? "New time" : "Confirm", "availability")}<div class="pad"><div class="summary"><div class="kicker">${esc(moving ? "Updated reservation" : "New reservation")}</div><h3>${esc(svc.name)}</h3><p class="meta">${esc(prettyDate(state.draft.date))}</p><p class="meta">${esc(rangeLabel(state.draft.time, svc.minutes))} CT</p><p class="meta">${esc(meetLabel(state.draft.meet))} · ${esc(advisorLabel(state.draft.advisor))}</p>${approval}</div><label class="label">Your details</label><input class="field" readonly value="${esc(state.profile.name)}" /><div style="height:8px"></div><input class="field" readonly value="${esc(state.profile.email)}" /><label class="label">Special requests</label><textarea data-field="draft.note" placeholder="Anything the business should know?">${esc(state.draft.note)}</textarea>${pay}${late}</div>`;

    function viewSuccess() {
      const b = bookingById(state.successId) || nextUp();

      const svc = serviceById(b.serviceId);
      const pending = b.status === "pending";
      return `<div class="center"><div class="ok ${pending ? "pending" : ""}">${icon("check")}</div><h2>${pending ? "Request sent" : "You’re reserved"}</h2><p class="meta">${pending ? "Northline will confirm this request." : "The time is held for you."}</p></div><div class="refbox"><span>Reference</span><b>${esc(b.ref)}</b></div><div class="center"><p><b>${esc(svc.name)}</b></p><p class="meta">${esc(prettyDate(b.date))} · ${esc(rangeLabel(b.time, svc.minutes))} CT</p></div><div class="pad stack"><button type="button" class="btn" data-act="detail" data-arg="${b.id}">View reservation</button><button type="button" class="btn-secondary" data-act="add-cal" data-arg="${b.id}">Add to phone calendar</button><button type="button" class="linkish" data-act="screen" data-arg="home">Back to home</button><button type="button" class="linkish" data-act="mode" data-arg="admin">See it on the business schedule</button></div>`;
    }
    function viewBookings() {
      const rows = myBookings(state.bookingTab);
      const list = rows.length ? rows.map(b => {
        const svc = serviceById(b.serviceId);
        return `<button type="button" class="book" data-act="detail" data-arg="${b.id}"><div class="rowline"><h3>${esc(svc.name)}</h3>${pill(b.status)}</div><div class="meta">${esc(prettyDate(b.date))} · ${esc(rangeLabel(b.time, svc.minutes))}</div><div class="rowline"><span class="meta">${esc(b.ref)}</span><span class="meta">${esc(payLabel(b))}</span></div></button>`;
      }).join("") : `<p class="meta">${state.bookingTab === "past" ? "No past reservations yet." : "No upcoming reservations."}</p>${state.bookingTab === "upcoming" ? `<button type="button" class="btn" data-act="screen" data-arg="services">Book a reservation</button>` : ""}`;

      const b = bookingById(state.detailId);

      const actions = open ? `<button type="button" class="btn" data-act="reschedule" data-arg="${b.id}">Reschedule</button><button type="button" class="btn-secondary" data-act="add-cal" data-arg="${b.id}">Add to phone calendar</button><button type="button" class="btn btn-danger" data-act="ask-cancel" data-arg="${b.id}">Cancel reservation</button>` : `<button type="button" class="btn-secondary" data-act="add-cal" data-arg="${b.id}">Add to phone calendar</button>`;
      return `${topbar("Reservation", "bookings")}<div class="pad"><div class="summary"><div class="rowline"><h3>${esc(svc.name)}</h3>${pill(b.status)}</div><p class="meta">${esc(prettyDate(b.date))}</p><p class="meta">${esc(rangeLabel(b.time, svc.minutes))} CT</p><p class="meta">${esc(meetLabel(b.meet))} · ${esc(advisorLabel(b.advisor))}</p><p class="meta">${esc(b.ref)} · ${esc(payLabel(b))}${b.amount ? " · " + esc(svc.priceLabel) : ""}</p>${b.note ? `<p class="meta">${esc(b.note)}</p>` : ""}</div><div class="stack">${actions}</div></div>`;

    function viewCalendar() {
      const items = state.bookings.filter(b => b.owner === "alex" && b.date === state.myDate && b.status !== "cancelled");
      const list = items.length ? items.map(b => {
        const svc = serviceById(b.serviceId);
        return `<button type="button" class="book" data-act="detail" data-arg="${b.id}"><h3>${esc(svc.name)}</h3><div class="meta">${esc(rangeLabel(b.time, svc.minutes))} · ${esc(b.ref)}</div><div class="rowline">${pill(b.status)}<span class="meta">${esc(meetLabel(b.meet))}</span></div></button>`;
      }).join("") : `<p class="meta">Nothing reserved on this day.</p>`;

    function showToast(msg) {

    function syncTour() {

    function paint(opts = {}) {
      const idx = TOUR.findIndex(t => t.mode === state.mode && t.screen === state.screen);
      document.getElementById("step").textContent = idx >= 0 ? `${idx + 1} / ${TOUR.length}` : "Preview";
      document.getElementById("nextBtn").textContent = idx === TOUR.length - 1 ? "Start over" : "Next";
      document.querySelector('[data-act="prev"]').disabled = state.tour <= 0 && idx <= 0;

        const el = [...document.querySelectorAll("[data-field]")].find(n => n.dataset.field === opts.focus);

    function selectDate(iso) {

        return;

      if (iso < TODAY) return;

    function shiftMonth(dir) {
      const key = state.screen === "calendar" ? "monthC" : "monthA";

      if (m > 12) { m = 1; y++; }

      if (y !== 2026 || m < min || m > 12) return;
      state[key] = { y, m };
      paint();

    function confirmBooking() {
      if (!state.draft.consent || !state.draft.serviceId || !state.draft.time) return;

      if (!slot || !customerCanTake(slot)) { showToast("That time was just taken. Choose another."); return; }
      const svc = serviceById(state.draft.serviceId);
      if (state.draft.rescheduleId) {
        const b = bookingById(state.draft.rescheduleId);

        time: state.draft.time,

    }
    function setStatus(id, status) {
      const b = bookingById(id);
      if (!b) return;
      b.status = status;
      const svc = serviceById(b.serviceId);
      if (b.owner === "alex") {
        addNotif({
          kind: "change",
          title: status === "confirmed" ? "Reservation confirmed" : "Reservation declined",
          body: `${svc.name} on ${prettyDate(b.date)} at ${prettyTime(b.time)} is ${status === "confirmed" ? "confirmed" : "declined"}.`,
          bookingId: b.id
        });
      }
      state.activity.unshift({ text: `${b.customer} · ${svc.name} ${status}.`, time: "Just now" });
      state.sheet = null;
      paint();
      showToast(status === "confirmed" ? "Reservation confirmed" : "Reservation declined");
    }
    function saveAdminBooking() {
      if (!state.form) return;
      const name = state.form.name.trim();
      if (!name) { showToast("Add a customer name"); return; }
      const slot = timeSlots(state.form.date).find(s => s.t === state.form.time);
      if (!slot || slot.status !== "open") { showToast("That opening is gone"); return; }
      const svc = serviceById(state.form.serviceId);
      const isAlex = name.toLowerCase() === state.profile.name.toLowerCase();
      const b = {
        id: "b" + Date.now(),
        ref: "RF-" + (24000 + state.bookings.length),
        customer: name,
        owner: isAlex ? "alex" : "guest",
        serviceId: svc.id,
        date: state.form.date,
        time: state.form.time,
        status: state.approval[svc.id] ? "pending" : "confirmed",
        pay: svc.price ? "due" : "none",
        amount: svc.price,
        note: "",
        meet: "video",
        advisor: "first"
      };
      state.bookings.push(b);
      if (isAlex) addNotif({ kind: "confirmation", title: "Reservation added", body: `${svc.name} on ${prettyDate(b.date)} at ${prettyTime(b.time)}.`, bookingId: b.id });
      state.activity.unshift({ text: `${name} booked ${svc.name} for ${prettyDate(b.date)}.`, time: "Just now" });
      state.form = null;
      paint();
      showToast("Reservation added");
    }
    function blockSlot(date, time) {
      state.blocks.push({ id: "k" + Date.now(), date, time, reason: "Blocked" });
      state.activity.unshift({ text: `Blocked ${prettyDate(date)} at ${prettyTime(time)}.`, time: "Just now" });
      paint();
      showToast("That time is now unavailable to customers");
    }
    function buyAddon(id) {
      if (!state.addons.includes(id)) state.addons.push(id);
      paint();
      showToast("Preview only. No charge is placed.");
    }

    const initialState = structuredClone(state);

    function resetAll() {
      const fresh = structuredClone(initialState);
      Object.keys(state).forEach(k => delete state[k]);
      Object.assign(state, fresh);
      paint();
      showToast("Preview reset");
    }
    function onClick(e) {
      if (e.target.closest("[data-act='stop']") && !e.target.closest("[data-act='stop'] [data-act]")) return;
      const el = e.target.closest("[data-act]");
      if (!el || el.disabled) return;
      const act = el.dataset.act;
      const arg = el.dataset.arg || "";
      if (act === "stop") return;
      switch (act) {
        case "mode": setMode(arg); break;
        case "screen": setScreen(arg); break;
        case "next": nextStep(); break;
        case "prev": prevStep(); break;
        case "reset": resetAll(); break;
        case "service": state.draft.serviceId = arg; paint(); break;
        case "meet": state.draft.meet = arg; paint(); break;
        case "advisor": state.draft.advisor = arg; paint(); break;
        case "date": selectDate(arg); break;
        case "time": state.draft.time = arg; paint(); break;
        case "month": shiftMonth(arg); break;
        case "cal-continue":
          if (!state.draft.time) return;
          setScreen(state.draft.serviceId ? "confirm" : "services");
          break;
        case "confirm-booking": confirmBooking(); break;
        case "pay": state.draft.payNow = arg === "now"; paint(); break;
        case "tab": state.bookingTab = arg; paint(); break;
        case "detail": state.detailId = arg; setScreen("detail"); break;
        case "reschedule": startReschedule(arg); break;
        case "ask-cancel": state.sheet = { type: "cancel", id: arg || state.detailId }; paint(); break;
        case "close-sheet": state.sheet = null; paint(); break;
        case "do-cancel": doCancel(state.sheet && state.sheet.id); break;
        case "add-cal": showToast("This would add the reservation to the phone calendar."); break;
        case "mark-all": state.notifications.forEach(n => { n.unread = false; }); paint(); break;
        case "open-note": {
          const n = state.notifications.find(x => x.id === arg);
          if (!n) return;
          n.unread = false;
          if (n.bookingId) { state.detailId = n.bookingId; setScreen("detail"); }
          else paint();
          break;
        }
        case "pref": state.prefs[arg] = !state.prefs[arg]; paint(); break;
        case "save-profile": paint(); showToast("Profile saved in this preview."); break;
        case "reset-pass": showToast("A reset link would be sent to " + state.profile.email); break;
        case "sign-out": setScreen("auth"); break;
        case "sign-in": setScreen("home"); showToast("Signed in as " + state.profile.name); break;
        case "forgot": showToast("A reset link would be sent to " + state.profile.email); break;
        case "download": showToast("A copy of the account data would download here."); break;
        case "ask-delete": state.sheet = { type: "delete" }; paint(); break;
        case "do-delete": state.sheet = null; paint(); showToast("Deletion request noted in this preview."); break;
        case "buy": buyAddon(arg); break;
        case "filter": state.adminFilter = arg; paint(); break;
        case "calview": state.calView = arg; paint(); break;
        case "admin-day": state.adminDate = arg; state.calView = "day"; paint(); break;
        case "shift-day": {
          const n = addDays(state.adminDate, Number(arg));
          if (n >= "2026-09-01" && n <= "2026-12-31") state.adminDate = n;
          paint();
          break;
        }
        case "today": state.adminDate = TODAY; paint(); break;
        case "approve": setStatus(arg, "confirmed"); break;
        case "decline": setStatus(arg, "cancelled"); break;
        case "toggle-approval": state.approval[arg] = !state.approval[arg]; paint(); break;
        case "start-form":
          state.form = { date: state.adminDate, time: arg, name: "", serviceId: "strategy" };
          paint({ focus: "form.name" });
          break;
        case "cancel-form": state.form = null; paint(); break;
        case "save-form": saveAdminBooking(); break;
        case "block": blockSlot(state.adminDate, arg); break;
        case "unblock":
          state.blocks = state.blocks.filter(b => b.id !== arg);
          paint();
          showToast("Opening restored");
          break;
        case "connect-cal":
          showToast("Apple, Google, and Outlook can be connected once the calendar choice is confirmed.");
          break;
        default: break;
      }
    }
    function onInput(e) {
      const el = e.target;
      if (!el.dataset || !el.dataset.field) return;
      setField(el.dataset.field, el.value);
      if (el.dataset.live) paint({ focus: el.dataset.field });
    }
    function onChange(e) {
      const el = e.target;
      if (el.dataset.act === "consent") {
        state.draft.consent = el.checked;
        const btn = document.getElementById("confirm-btn");
        if (btn) btn.disabled = !el.checked;
        return;
      }
      if (el.dataset.act === "cancel-hours") {
        state.rules.cancelHours = Number(el.value);
        paint();
        return;
      }
      if (el.dataset.field) setField(el.dataset.field, el.type === "checkbox" ? el.checked : el.value);
    }
    function onKey(e) {
      if (e.target.matches("input, textarea, select")) return;
      if (e.key === "ArrowRight") nextStep();
      if (e.key === "ArrowLeft") prevStep();
    }

    paint();
    document.body.addEventListener("click", onClick);
    document.body.addEventListener("input", onInput);
    document.body.addEventListener("change", onChange);
    document.addEventListener("keydown", onKey);
  </script>
</body>
</html>
